/* PREDMETY */

const subjectIds=["math","informatics","slovak","english","czech","science"];
const icons=["➗","💻","🇸🇰","🇬🇧","🇨🇿","🔬"];

let selectedGrade="";
let selectedSubject="";
let currentLessons=[];
let currentLang="sk";

const gradeGrid=document.getElementById("gradeGrid");

function renderGrades(){
gradeGrid.innerHTML="";
for(let i=1;i<=13;i++){
let secondary=i>9;
let number=secondary?i-9:i;
let card=document.createElement("div");
card.className="card";
card.innerHTML=`<div class="icon">🎓</div><h3>${number}. ${T[currentLang].grades[secondary?1:0]}</h3><p>${secondary?"🏫 Stredná škola":"📚 Základná škola"}</p>`;
card.onclick=()=>{
selectedGrade=i;
showSubjects();
};
gradeGrid.appendChild(card);
}
}

function changeLanguage(){
currentLang=document.getElementById("language").value;
const t=T[currentLang];

document.documentElement.lang=currentLang;
document.getElementById("heroTitle").innerHTML=t.hero+' <span>Learn Now</span>';
document.getElementById("heroDescription").textContent=t.description;
document.getElementById("gradeTitle").textContent=t.grade;
document.getElementById("gradeDescription").textContent=t.gradeDesc;
document.getElementById("subjectTitle").textContent=t.subjects;
document.getElementById("topicTitle").textContent=t.topics;
document.getElementById("search").placeholder=t.search;
document.getElementById("backText").textContent=t.back;
document.getElementById("subjectBack").textContent=t.subjectBack;
document.getElementById("topicBack").textContent=t.topicBack;

renderGrades();

if(!document.getElementById("subjectSection").classList.contains("hidden")){
showSubjects();
}
}

function showSubjects(){
hideAll();
document.getElementById("subjectSection").classList.remove("hidden");
const grid=document.getElementById("subjectGrid");
grid.innerHTML="";
const t=T[currentLang];

subjectIds.forEach((id,i)=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`<div class="icon">${icons[i]}</div><h3>${t.subjects[i]}</h3><p>${t.descriptions[i]}</p>`;
card.onclick=()=>{
selectedSubject=id;
showTopics();
};
grid.appendChild(card);
});
}

function showTopics(){
hideAll();
document.getElementById("topicSection").classList.remove("hidden");
document.getElementById("search").value="";
currentLessons=lessons[currentLang][selectedSubject]||[];
const list=document.getElementById("topicList");
list.innerHTML="";

currentLessons.forEach((lesson,index)=>{
const item=document.createElement("div");
item.className="topic";
item.textContent=lesson[0];
item.onclick=()=>openLesson(index);
list.appendChild(item);
});
}

function searchTopics(){
const query=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".topic").forEach(item=>{
item.style.display=item.textContent.toLowerCase().includes(query)?"block":"none";
});
}

function openLesson(index){
hideAll();
document.getElementById("lessonSection").classList.remove("hidden");
const l=currentLessons[index];
const correct=l[6];

document.getElementById("lessonContent").innerHTML=`
<h2>${l[0]}</h2>
<p>${l[1]}</p>
<div class="example"><h3>📖 ${currentLang==="en"?"Example":currentLang==="de"?"Beispiel":currentLang==="fr"?"Exemple":currentLang==="es"?"Ejemplo":currentLang==="pl"?"Przykład":currentLang==="sl"?"Primer":"Príklad"}</h3>${l[2]}</div>
<div class="quiz">
<h3>🧠 ${currentLang==="en"?"Mini quiz":currentLang==="de"?"Mini-Test":currentLang==="fr"?"Mini-test":currentLang==="es"?"Mini prueba":currentLang==="pl"?"Mini test":currentLang==="sl"?"Mini test":"Mini test"}</h3>
<p>${l[3]}</p>
${l[4].map((answer,i)=>`<button onclick="checkAnswer(this,${i},${correct})">${answer}</button>`).join("")}
<div class="result"></div>
</div>`;
}

function checkAnswer(button,selected,correct){
const quiz=button.parentElement;
if(quiz.dataset.answered==="true")return;
quiz.dataset.answered="true";
const result=quiz.querySelector(".result");

if(selected===correct){
result.textContent=currentLang==="en"?"✅ Correct!":currentLang==="de"?"✅ Richtig!":currentLang==="fr"?"✅ Correct !":currentLang==="es"?"✅ ¡Correcto!":currentLang==="pl"?"✅ Dobrze!":currentLang==="sl"?"✅ Pravilno!":"✅ Správne! Výborne!";
result.style.color="#55dd99";
}else{
result.textContent=currentLang==="en"?"❌ Try again next time!":currentLang==="de"?"❌ Versuche es noch einmal!":currentLang==="fr"?"❌ Essaie encore !":currentLang==="es"?"❌ ¡Inténtalo de nuevo!":currentLang==="pl"?"❌ Spróbuj ponownie!":currentLang==="sl"?"❌ Poskusi znova!":"❌ Skús si učivo zopakovať.";
result.style.color="#ff7777";
}
}

function hideAll(){
["gradeSection","subjectSection","topicSection","lessonSection"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});
}

function goBack(){
hideAll();
document.getElementById("gradeSection").classList.remove("hidden");
}

renderGrades();
changeLanguage();

</script>

</html>
